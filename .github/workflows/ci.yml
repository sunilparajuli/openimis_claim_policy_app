name: Flutter CI and Android Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  verify-and-build:
    name: Verify and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: any
          cache: true

      - name: Create CI environment files
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DATA_MODE: ${{ vars.DATA_MODE }}
          API_KEY: ${{ secrets.API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          api_url="${API_BASE_URL:-https://demo.openimis.org/}"
          api_key="${API_KEY:-}"
          data_mode="${DATA_MODE:-live}"
          maps_key="${GOOGLE_MAPS_API_KEY:-ci-placeholder}"
          for flavor in dev prod; do
            printf '%s\n' \
              "API_BASE_URL=$api_url" \
              "API_KEY=$api_key" \
              "ENVIRONMENT=$flavor" \
              "DATA_MODE=$data_mode" \
              "GOOGLE_MAPS_API_KEY=$maps_key" > ".env.$flavor"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Generate source
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --no-pub --coverage

      - name: Build optimized production APK
        run: flutter build apk --release --split-per-abi --flavor prod --target lib/main/main_prod.dart --no-pub

      - name: Name release APKs
        run: |
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-prod-release.apk openimis-claim-policy-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-prod-release.apk openimis-claim-policy-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-prod-release.apk openimis-claim-policy-x86_64.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: openimis-claim-policy-app-${{ github.sha }}
          path: openimis-claim-policy-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  github-release:
    name: Publish tagged GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: openimis-claim-policy-app-${{ github.sha }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: openimis-claim-policy-*.apk
          generate_release_notes: true
