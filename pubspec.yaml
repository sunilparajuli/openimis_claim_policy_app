name: openimis_claim_policy_app
description: "openIMIS mobile application for claims and policy operations."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0
  dio: ^5.10.0
  json_annotation: ^4.11.0
  auto_route: ^11.1.0
  webview_flutter: ^4.14.1
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.1
  # Security
  flutter_secure_storage: ^10.3.1
  envied: ^1.3.8
  sqflite: ^2.4.4+1
  path: ^1.9.1
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  # used with freezed model
  json_serializable: ^6.13.0
  auto_route_generator: ^10.4.0
  build_runner: ^2.4.14
  freezed: ^3.2.5
  envied_generator: ^1.3.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/openimis-logo.png
    - assets/config/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
